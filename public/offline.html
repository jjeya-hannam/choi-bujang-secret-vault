<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07101b">
  <title>최 부장 보관함 · 오프라인</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#07101b;color:#ecf5ff}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:480px;background:#0d1c2b;border:1px solid #2b5061;border-radius:20px;padding:32px}
    img{width:72px;height:72px}h1{font-size:28px}p{line-height:1.7;color:#b5c9d6}
    a{display:inline-block;background:#85e8e3;color:#052129;border-radius:10px;padding:12px 16px;text-decoration:none;font-weight:700}
    a:focus-visible{outline:2px solid white;outline-offset:4px}
  </style>
</head>
<body><main>
  <img src="/icons/vault-192.png" alt="">
  <h1>연결을 기다리고 있어요.</h1>
  <p>최 부장 보관함의 보호된 메모는 오프라인에 저장하지 않습니다. 인터넷에 연결한 뒤 로그인과 기기 승인 상태를 다시 확인하세요.</p>
  <a href="/">연결 후 다시 열기</a>
</main></body>
</html>
